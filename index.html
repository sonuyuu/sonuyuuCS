<!DOCTYPE html>
<html lang=ru>
  <head>
  <meta charset="utf-8">
  <meta name="author" content="sonuyuu">

    <meta name="keywords" content="CSonu">
      <title>Главная страница</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1 class="zag">CSonu</h1>
    <p style="color: grey" class="pre"><abbr title="Sonu Kormit">Сайт SK</abbr></p>
    <div class="match-card">
      <h2>Следующий матч</h2>
      <p><strong>Режим:</strong> Закладка Бомбы (5x5)</p>
      <p><strong>Карта:</strong> De_Dust2</p>
      <p class="zel"><strong>Статус:</strong> <span class="status-green"> Набор открыт</span></p>
      <p><strong>Дата:</strong> 29 июня</p>
    </div>
    <a href="resourcepack.zip" download class="btn-orange">СКАЧАТЬ РЕСУРС ПАК (.zip)</a>
    <form class="event-form">
  <h3>ЗАНЯТЬ СЛОТ НА ИВЕНТ</h3>
  <p class="slots-count">Занято мест: 0 из 10</p>
  
  <input type="text" placeholder="Введите свой ник" class="input-nick">
  
    <!-- Переключатели фракций (Выбор стороны) -->
  <div class="faction-selector">
    <label class="radio-label t-side">
      <input type="radio" name="faction" value="t" checked>
      <span class="custom-radio"></span> Террористы
    </label>
    
    <label class="radio-label">
      <input type="radio" name="faction" value="ct" class="ct-side">
      <span class="custom-radio"></span> Спецназ
    </label>
  </div>

  
  <button type="submit" class="btn-submit">ЗАРЕГАТЬ ИГРУ</button>
</form>
<script src="script.js"></script> 
</body>
</html>
