<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Панель Администратора</title>
  <style>
    body { background: #14171c; color: white; font-family: sans-serif; padding: 20px; }
    h1 { text-align: center; color: #ff9f43; margin-bottom: 30px; }
    .apps-list { max-width: 500px; margin: 20px auto; background: #262626; border: 2px solid #2f2f2f; border-radius: 8px; padding: 15px; }
    .app-card { background: #14171c; border: 1px solid #2f2f2f; padding: 12px; margin-bottom: 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
    .btn { padding: 8px 14px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-left: 5px; transition: 0.1s; -webkit-tap-highlight-color: transparent; }
    .btn-approve { background: #2ed573; color: white; }
    .btn-reject { background: #ff4757; color: white; }
    .btn-remove { background: #ff4757; color: white; padding: 6px 10px; font-size: 0.85rem; }
    .btn:active { opacity: 0.7; }
    .faction-t { color: #ff4757; font-weight: bold; }
    .faction-ct { color: #54a0ff; font-weight: bold; }
    .no-apps { text-align: center; color: grey; font-size: 0.9rem; }
    h3 { margin-top: 5px; border-bottom: 1px solid #2f2f2f; padding-bottom: 8px; color: #e2e7ed; }
  </style>
</head>
<body>

  <h1>Панель управления ивентом</h1>
  
  <div class="apps-list">
    <h3>Новые заявки (в ожидании):</h3>
    <div id="pending-container">Загрузка заявок...</div>
  </div>

  <div class="apps-list" style="border-color: #2ed573;">
    <h3 style="color: #2ed573;">Одобренные участники (минус места):</h3>
    <div id="approved-container">Загрузка участников...</div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    // Твоя конфигурация базы данных
    const firebaseConfig = {
      apiKey: "AIzaSyBgB8nsW5qbHHyUCrr8Vb0s3zisIgrIcPc",
      authDomain: "csonu-db.firebaseapp.com",
      databaseURL: "https://csonu-db-default-rtdb.firebaseio.com",
      projectId: "csonu-db",
      storageBucket: "csonu-db.firebasestorage.app",
      messagingSenderId: "186509148543",
      appId: "1:186509148543:web:af1e895c8d1660a3ea9a4a"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // Слушаем базу данных в реальном времени
    database.ref('applications').on('value', (snapshot) => {
        const pendingContainer = document.getElementById('pending-container');
        const approvedContainer = document.getElementById('approved-container');
        
        pendingContainer.innerHTML = "";
        approvedContainer.innerHTML = "";
        
        let hasPending = false;
        let hasApproved = false;

        snapshot.forEach((childSnapshot) => {
            const id = childSnapshot.key;
            const data = childSnapshot.val();
            
            const factionClass = data.faction === "t" ? "faction-t" : "faction-ct";
            const factionName = data.faction === "t" ? "Террористы" : "Спецназ";

            // 1. Если заявка ожидает одобрения
            if (data.status === "pending") {
                hasPending = true;
                pendingContainer.innerHTML += `
                    <div class="app-card">
                        <div>
                            <strong>${data.nickname}</strong> 
                            <br><span class="${factionClass}">${factionName}</span>
                        </div>
                        <div>
                            <button class="btn btn-approve" onclick="updateStatus('${id}', 'approved')">Одобрить</button>
                            <button class="btn btn-reject" onclick="updateStatus('${id}', 'rejected')">Х</button>
                        </div>
                    </div>
                `;
            }
            
            // 2. Если заявка УЖЕ ОДОБРЕНА (Выводим игроков сюда с возможностью удалить)
            if (data.status === "approved") {
                hasApproved = true;
                approvedContainer.innerHTML += `
                    <div class="app-card" style="border-left: 3px solid #2ed573;">
                        <div>
                            <strong>${data.nickname}</strong> 
                            <br><span class="${factionClass}">${factionName}</span>
                        </div>
                        <div>
                            <button class="btn btn-remove" onclick="updateStatus('${id}', 'rejected')">Убрать из игры (-1)</button>
                        </div>
                    </div>
                `;
            }
        });

        // Если списки пустые — пишем заглушки
        if (!hasPending) {
            pendingContainer.innerHTML = '<p class="no-apps">Новых заявок пока нет.</p>';
        }
        if (!hasApproved) {
            approvedContainer.innerHTML = '<p class="no-apps">Пока нет одобренных участников.</p>';
        }
    });

    // Функция обновления статуса в Firebase
    function updateStatus(id, newStatus) {
        database.ref('applications/' + id).update({
            status: newStatus
        });
    }
  </script>
</body>
</html>
